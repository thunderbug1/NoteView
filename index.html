<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NoteView</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src * data: blob:; media-src 'self' blob: https:;">
    <!-- Note: iOS Safari requires PNG for apple-touch-icon; SVG is provided as fallback -->
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/views/document.css">
    <link rel="stylesheet" href="css/views/timeline.css">
    <link rel="stylesheet" href="css/views/kanban.css">
    <link rel="stylesheet" href="css/views/history.css">
    <link rel="stylesheet" href="css/views/settings.css">
    <link rel="stylesheet" href="css/views/deadline.css">
    <link rel="stylesheet" href="css/views/ai.css">
    <link rel="stylesheet" href="css/views/aiTaskPanel.css">
    <link rel="stylesheet" href="css/views/capture.css">
    <link rel="stylesheet" href="css/views/qr-transfer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar" aria-label="Navigation sidebar">
            <div class="app-header">
                <a href="https://github.com/thunderbug1/NoteView" target="_blank" rel="noopener noreferrer" class="app-logo-link">
                    <img src="assets/icon-light.svg" alt="NoteView" class="app-logo-icon" id="appLogoIcon">
                </a>
                <div class="header-actions">
                    <button id="contextBackBtn" class="context-nav-btn" title="Back (Alt+Left)" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button id="contextForwardBtn" class="context-nav-btn" title="Forward (Alt+Right)" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                    <button id="themeToggleBtn" class="theme-toggle" title="Toggle Dark/Light Mode">
                        <span class="sun-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
                        <span class="moon-icon" style="display: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
                    </button>
                </div>
            </div>

            <!-- View Selector -->
            <div class="sidebar-section">
                <div class="section-header">
                    <h3>View</h3>
                </div>
                <div class="tag-radio-group" id="viewSelectTags">
                    <div class="tag-radio-option selected" data-group="view" data-tag="document">
                        <span class="tag-badge">Document</span>
                    </div>
                    <div class="tag-radio-option" data-group="view" data-tag="timeline">
                        <span class="tag-badge">Timeline</span>
                    </div>
                    <div class="tag-radio-option" data-group="view" data-tag="kanban">
                        <span class="tag-badge">Kanban</span>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <div class="sidebar-section">
                <div class="section-header">
                    <h3>Search</h3>
                </div>
                <div class="search">
                    <label for="searchInput" class="sr-only">Search blocks</label>
                    <input type="text" id="searchInput" placeholder="Search blocks...">
                </div>
            </div>

            <div class="sidebar-scroll">
            <!-- Tag Groups -->
            <div class="sidebar-section">
                <!-- Tags Group -->
                <div class="tag-group" id="contextTagGroup">
                    <div class="section-header">
                        <h3>Tags</h3>
                        <button class="section-clear-btn" id="clearContextBtn" title="Clear tags" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.622 17.897-10.68-2.913"></path><path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z"></path><path d="M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15"></path></svg>
                        </button>
                    </div>
                    <div class="tag-radio-group" id="contextTags"></div>
                </div>

                <!-- Time Filter Group -->
                <div class="tag-group" id="timeTagGroup">
                    <div class="section-header">
                        <h3>Time</h3>
                        <select id="timePropertySelect" class="time-property-select" title="Which date field to filter by">
                            <option value="lastUpdated">Last Updated</option>
                            <option value="creationDate">Created</option>
                            <option value="due">Due Date</option>
                            <option value="start">Start Date</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="tag-radio-group" id="timeTags"></div>
                </div>

                <!-- Computed Tags Group -->
                <div class="tag-group" id="computedTagGroup">
                    <div class="section-header">
                        <h3>Computed</h3>
                    </div>
                    <div class="tag-radio-group" id="computedTags"></div>
                </div>

                <!-- Archived Tags Group -->
                <div class="tag-group" id="archivedTagGroup" style="display:none;">
                    <div class="section-header">
                        <h3 class="archive-section-toggle" style="cursor:pointer;">
                            <span class="tag-group-toggle" style="display:inline-block; font-size:0.6rem;">&#9654;</span>
                            Archive
                        </h3>
                    </div>
                    <div class="tag-radio-group" id="archivedTags" style="display:none;"></div>
                </div>

                <!-- Contacts Group -->
                <div class="tag-group" id="contactTagGroup">
                    <div class="section-header">
                        <h3>People</h3>
                    </div>
                    <div class="tag-radio-group" id="contactTags">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
            </div>

            <!-- Vault Switcher & Settings -->
            <div class="sidebar-footer">
                <button id="vaultSwitcherBtn" class="vault-switcher" title="Switch vault">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span id="vaultSwitcherName" class="vault-name">No vault</span>
                    <svg class="vault-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <button id="settingsBtn" class="icon-btn sidebar-settings-btn" title="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </aside>

        <div id="sidebarOverlay"></div>

        <!-- Main Content -->
        <div id="sidebarEdgeLeft" class="sidebar-edge sidebar-edge-left"></div>
        <div id="sidebarEdgeRight" class="sidebar-edge sidebar-edge-right"></div>

        <main id="main" aria-label="Note content">
            <div id="contentToolbar" class="content-toolbar">
                <div class="content-toolbar-left">
                    <div class="undo-redo-controls">
                        <button id="undoBtn" class="toolbar-btn" title="Undo [Ctrl+Z]" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path></svg>
                        </button>
                        <button id="redoBtn" class="toolbar-btn" title="Redo [Ctrl+Y]" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"></path></svg>
                        </button>
                    </div>
                    <button id="toolbarSortBtn" class="toolbar-btn" title="Sort">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"></path><path d="M11 9h7"></path><path d="M11 13h4"></path><path d="m3 17 3 3 3-3"></path><path d="M6 18V4"></path></svg>
                    </button>
                    <button id="toolbarRecentBtn" class="toolbar-btn" title="Sort by recently viewed (Alt+R)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </button>
                    <button id="toolbarGroupBtn" class="toolbar-btn" title="Group">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="4" rx="1"></rect><rect x="3" y="10" width="12" height="4" rx="1"></rect><rect x="3" y="17" width="7" height="4" rx="1"></rect></svg>
                    </button>
                    <button id="toolbarSelectBtn" class="toolbar-btn" title="Select mode (Ctrl+Shift+S)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    </button>
                </div>
                <div class="content-toolbar-right">
                    <button id="exportBtn" class="toolbar-btn" title="Export visible notes">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                    <button id="toolbarAiBtn" class="toolbar-btn" title="Batch AI (Ctrl+Shift+B)" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                    </button>
                    <button id="toolbarSyncBtn" class="toolbar-btn" title="Sync: no remote configured" style="position:relative">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
                    </button>
                </div>
            </div>
            <div id="filterBar" class="filter-bar" hidden>
                <span class="filter-bar-count"></span>
                <div class="filter-bar-tags"></div>
                <button class="filter-bar-clear" title="Clear all filters">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="viewContainer"></div>
            <!-- Floating Action Button -->
            <button id="fabNewNote" class="fab" title="New Note">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </main>

        <!-- Right Sidebar -->
        <button id="sidebarRightToggle" class="sidebar-right-toggle" title="Toggle details panel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <aside id="sidebarRight" aria-label="Details panel">
            <div class="sidebar-scroll">
                <!-- Content placeholder -->
            </div>
        </aside>

        <!-- AI Panel Overlay (mobile) -->
        <div id="aiPanelOverlay" aria-hidden="true"></div>

        <!-- AI Panel -->
        <div id="aiPanel" role="complementary" aria-label="AI Assistant" aria-hidden="true">
            <div class="ai-panel-header">
                <div class="ai-panel-brand">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                    <span>AI</span>
                </div>
                <span class="ai-panel-badge" id="aiPanelBadge" style="display:none"></span>
                <button class="ai-panel-new-chat-btn" id="aiNewChatBtn" title="New chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button class="ai-panel-close-btn" id="aiPanelCloseBtn" title="Close AI Panel">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="ai-session-list-wrap" id="aiSessionListWrap">
                <div class="ai-chat-tabs" id="aiChatTabs"></div>
            </div>
            <div class="ai-chat-active" id="aiChatActive"></div>
        </div>

    </div>

    <!-- PWA install prompt (outside #app to avoid flex layout interference) -->
    <div id="installBanner" class="install-banner">
        <span>Install NoteView for the best mobile experience</span>
        <button id="installBtn">Install</button>
        <button id="installDismissBtn" class="dismiss">&times;</button>
    </div>

    <!-- Libraries -->
    <script src="vendor/marked.js"></script>
    <script src="vendor/isomorphic-git.js"></script>
    <script src="vendor/isomorphic-git-http.js"></script>
    <script src="vendor/qrcode-generator.js"></script>
    <script src="vendor/jsQR.js"></script>
    <script src="vendor/lz-string.js"></script>

    <!-- CodeMirror 6 for Live Preview Markdown Editing -->
    <script src="vendor/codemirror.js"></script>

    <!-- App Scripts -->
    <script src="js/gitFs.js"></script>
    <script src="js/gitStore.js"></script>
    <script src="js/gitRemote.js"></script>
    <script src="js/syncManager.js"></script>

    <!-- Utilities -->
    <script src="js/utils/common.js"></script>
    <script src="js/utils/modal.js"></script>
    <script src="js/utils/taskParser.js"></script>
    <script src="js/utils/deadlinePanel.js"></script>
    <script src="js/utils/backlinksPanel.js"></script>
    <script src="js/utils/aiTaskPanel.js"></script>
    <script src="js/utils/timeFilter.js"></script>
    <script src="js/utils/contactHelper.js"></script>
    <script src="js/utils/cacheManager.js"></script>
    <script src="js/utils/recentAccessTracker.js"></script>
    <script src="js/utils/appSettings.js"></script>
    <script src="js/utils/qrTransfer.js"></script>
    <script src="js/utils/sendToVault.js"></script>
    <script src="js/utils/floatingMenu.js"></script>
    <script src="js/utils/datePopover.js"></script>
    <script src="js/utils/editorTheme.js"></script>
    <script src="js/utils/blockFilter.js"></script>

    <script src="js/undoRedoManager.js"></script>
    <script src="js/store.js"></script>
    <script src="js/utils/sortManager.js"></script>
    <script src="js/utils/groupManager.js"></script>
    <script src="js/selectionManager.js"></script>
    <script src="js/widgets/codeMirrorWidgets.js"></script>
    <script src="js/menus/taskMenus.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/views/document.js"></script>
    <script src="js/views/timeline.js"></script>
    <script src="js/views/kanban.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/views/capture.js"></script>
    <script src="js/ai.js"></script>

    <script src="js/modals/tagModal.js"></script>
    <script src="js/modals/assigneeModal.js"></script>
    <script src="js/modals/vaultModal.js"></script>
    <script src="js/modals/newNoteModal.js"></script>
    <script src="js/blockSelector.js"></script>

    <script src="js/main.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=37');
        }
    </script>

</body>
</html>
