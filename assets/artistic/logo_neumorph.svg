<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#F1F5F9"/>
  <rect x="100" y="100" width="312" height="312" rx="60" fill="#F1F5F9" filter="url(#neuShadow)"/>
  <path d="M180 320V192L332 320V192" stroke="#3B82F6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#neuInner)"/>
  <defs>
    <filter id="neuShadow" x="50" y="50" width="412" height="412" filterUnits="userSpaceOnUse">
      <feDropShadow dx="15" dy="15" stdDeviation="10" flood-color="#CBD5E1"/>
      <feDropShadow dx="-15" dy="-15" stdDeviation="10" flood-color="white"/>
    </filter>
    <filter id="neuInner" x="150" y="150" width="212" height="212" filterUnits="userSpaceOnUse">
      <feOffset dx="4" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
      <feFlood flood-color="#CBD5E1" result="color"/>
      <feComposite in="color" in2="shadow" operator="in" result="insetShadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="insetShadow"/>
      </feMerge>
    </filter>
  </defs>
</svg>
