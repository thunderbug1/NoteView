<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Overlapping circles with translucency -->
  <circle cx="200" cy="256" r="140" fill="#3B82F6" fill-opacity="0.5"/>
  <circle cx="312" cy="256" r="140" fill="#2563EB" fill-opacity="0.4"/>
  <circle cx="256" cy="180" r="140" fill="#1D4ED8" fill-opacity="0.3"/>
  
  <!-- Central "Focus" element -->
  <g filter="url(#filter0_b_lens_abstract)">
    <circle cx="256" cy="256" r="80" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="256" cy="256" r="40" fill="white" fill-opacity="0.8"/>
    <!-- Lens Shine -->
    <path d="M230 230C240 220 270 220 282 230" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <defs>
    <filter id="filter0_b_lens_abstract" x="176" y="176" width="160" height="160" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
